<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple App Frontend</title>
</head>
<body>
    <h1>User Data Submission</h1>
    <form id="dataForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" required><br><br>
        
        <button type="submit">Submit Data</button>
    </form>
    
    <h2>Stored Data:</h2>
    <ul id="dataList"></ul>
    
    <script>
        const API_BASE_URL = 'http://localhost:3000/api'; // This will be the exposed port
        
        document.getElementById('dataForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    alert('Data submitted successfully!');
                    document.getElementById('dataForm').reset();
                    fetchData(); // Refresh list after submission
                } else {
                    alert('Submission failed.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection error to backend.');
            }
        });

        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE_URL}/data`);
                const data = await response.json();
                const list = document.getElementById('dataList');
                list.innerHTML = ''; // Clear existing list

                data.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `User: ${item.username}, Saved At: ${new Date(item.timestamp).toLocaleString()}`;
                    list.appendChild(listItem);
                });
            } catch (error) {
                console.error('Failed to fetch data:', error);
            }
        }
        
        fetchData(); // Initial load
    </script>
</body>
</html>
